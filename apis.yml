aid: ventuals
name: Ventuals
description: >-
  Ventuals was a Paradigm-incubated trading venue for perpetual futures on
  frontier technology — pre-IPO private companies (SpaceX, OpenAI, Anthropic),
  thematic stock indices, and commodities — built on Hyperliquid's HIP-3
  builder-deployed perps standard, margined and settled in USDH with up to 20x
  leverage. Ventuals published no first-party API; its vntl-prefixed markets
  were accessed programmatically through the Hyperliquid API (dex "vntl"). The
  platform announced its sunset on June 15, 2026, settling all markets that
  week and winding down vHYPE, with a sunset page maintained through at least
  September 15, 2026.
